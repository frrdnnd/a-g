name: Auto Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "frrdnnd"
          git config --global user.email "ferneedevweb@gmail.com"

      - name: Make changes
        run: |
          echo "Auto commit on $(date)" >> auto-commit.txt

      - name: Commit changes
        run: |
          git add .
          git commit -m "Auto commit by GitHub Actions" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
