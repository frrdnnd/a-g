name: Auto Commit

on:
  schedule:
    - cron: '0 0 * * *'   # jalan tiap hari jam 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "frrdnnd"
          git config --global user.email "ferneedevweb@gmail.com"

      - name: Make multiple commits
        run: |
          # Ubah angka di bawah ini untuk atur jumlah commit per hari
          COMMIT_COUNT=6

          for i in $(seq 1 $COMMIT_COUNT); do
            echo "Auto commit #$i on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> auto-commit.txt
            git add .
            git commit -m "Auto commit #$i by GitHub Actions" || echo "No changes to commit"
          done

      - name: Push changes
        run: |
          git push
